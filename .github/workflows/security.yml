name: Security regression checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r backend/requirements-test.txt pip-audit
      - run: python -m pytest backend/tests/test_security_boundaries.py backend/tests/test_uqflex_catalog.py backend/tests/test_discord_economy.py tests/test_discord_api_validation.py -q
      - run: python -m pip_audit --progress-spinner off
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npm audit
      - run: npm test -- --watchAll=false --runInBand --testPathPattern=security.test.jsx
        env:
          CI: 'true'
      - run: npm run build
        env:
          CI: 'true'
          GENERATE_SOURCEMAP: 'false'
