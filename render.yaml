services:
  - type: web
    name: yourmovies-backend
    runtime: python
    rootDir: backend
    plan: free
    healthCheckPath: /api/health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn server:app --no-proxy-headers --no-access-log --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.6
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: yourmovies
      - key: COOKIE_SAMESITE
        value: none
      # Free public web services cannot receive private-network traffic.
      # Reassess this edge-only trust boundary before changing the topology/plan.
      - key: CLIENT_IP_SOURCE
        value: render-cloudflare
      - key: TRUSTED_PROXY_CIDRS
        sync: false
      - key: BUNNY_TOKEN_AUTH_KEY
        sync: false
      - key: BUNNY_CDN_TOKEN_AUTH_KEY
        sync: false
      - key: TURNSTILE_SITE_KEY
        sync: false
      - key: TURNSTILE_SECRET_KEY
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
      - key: APP_NAME
        value: yourmovies
      - key: GOOGLE_CLIENT_ID
        value: 709682814260-hmnqf2ca2jh12puead6f4j39uabef1t9.apps.googleusercontent.com
      - key: CLOUDINARY_URL
        sync: false
      - key: BUNNY_LIBRARY_ID
        value: "719915"
      - key: BUNNY_CDN_HOST
        value: vz-37df92f2-4c9.b-cdn.net
      - key: BUNNY_API_KEY
        sync: false
      - key: OMDB_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
